services:
  - type: web
    name: alan-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn my_website.wsgi:application --bind "0.0.0.0:$PORT" --no-control-socket
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_SECRET_KEY
        generateValue: true
